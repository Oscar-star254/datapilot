name: Playwright Smoke Tests

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: Frontend URL to test
        required: true
        default: https://datapilot.vercel.app
      backend_url:
        description: Backend URL
        required: true
        default: https://datapilot-api.onrender.com
  schedule:
    # Run smoke tests daily at 08:00 UTC
    - cron: "0 8 * * *"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Playwright
        run: |
          npm init -y
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          FRONTEND_URL: ${{ github.event.inputs.frontend_url || 'https://datapilot.vercel.app' }}
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://datapilot-api.onrender.com' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test --reporter=html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
